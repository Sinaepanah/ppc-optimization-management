<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9c3"/>
      <stop offset="40%" style="stop-color:#fde047"/>
      <stop offset="70%" style="stop-color:#facc15"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.08"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#gold)"/>
  <rect width="32" height="32" rx="8" fill="url(#shine)"/>
  <text x="16" y="21" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="17" font-weight="600" fill="#a16207" text-anchor="middle">A</text>
