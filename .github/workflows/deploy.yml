# Deploy Vite build to GitHub Pages (same action order as github.com/actions/starter-workflows pages/static.yml).
#
# If "Setup Pages" fails with HttpError 404 / "Get Pages site failed", the repo has no GitHub Pages
# site yet (REST API GET .../pages returns Not Found). Fix in the GitHub UI (repo admin):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Do not use "Deploy from a branch" for this workflow. Save, then re-run the workflow.
# Private repos: GitHub Pages may require a paid plan; see GitHub Pages documentation.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run before install/build — matches official static Pages workflow; v5 pairs with deploy-pages@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify dist
        run: test -d dist && test -f dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
